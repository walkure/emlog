name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (kernel module + userspace tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kernel headers and FUSE/libcap dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-headers-$(uname -r)" libfuse-dev libcap-dev

      - name: make
        run: make

      - name: Verify build outputs
        run: |
          test -f emlog.ko
          test -x nbcat
          test -x mkemlog
          test -x emlog_stat
          test -x emlog_fuse
          modinfo ./emlog.ko

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: emlog-build-${{ github.sha }}
          path: |
            emlog.ko
            nbcat
            mkemlog
            emlog_stat
            emlog_fuse
          if-no-files-found: error

  smoke-test:
    name: Smoke test (insmod / mknod / read-write / rmmod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kernel headers and FUSE/libcap dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-headers-$(uname -r)" libfuse-dev libcap-dev

      - name: test/run_basic_smoke_test.sh
        run: test/run_basic_smoke_test.sh

  build-tools:
    name: Build userspace tools (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard Debian multiarch: covers everything from a generic
          # x86_64 host up through Pi 2/3/4/5 and Zero 2 W (32- or
          # 64-bit userland).
          - name: amd64
            platform: linux/amd64
            image: debian:bullseye-slim
          - name: arm64
            platform: linux/arm64
            image: debian:bullseye-slim
          - name: armv7-armhf
            platform: linux/arm/v7
            image: debian:bullseye-slim
          # Debian's own armhf targets ARMv7+; the original Pi
          # Zero/Zero W/Pi 1 are ARMv6 and need Raspberry Pi OS's own
          # ARMv6-baseline armhf toolchain instead, which balenalib's
          # rpi-raspbian image mirrors (there's no official Debian
          # ARMv6 hard-float port to build against).
          - name: armv6-raspbian
            platform: linux/arm/v6
            image: balenalib/rpi-raspbian:bullseye
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - name: Build nbcat/mkemlog/emlog_stat/emlog_fuse in ${{ matrix.image }} (${{ matrix.platform }})
        run: |
          docker run --rm --platform=${{ matrix.platform }} \
            -v "$PWD":/src -w /src \
            ${{ matrix.image }} \
            bash -c '
              set -eux
              apt-get update
              apt-get install -y --no-install-recommends build-essential pkg-config libfuse-dev libcap-dev
              make nbcat mkemlog emlog_stat emlog_fuse
            '

      - name: Rename outputs with arch suffix
        run: |
          mkdir -p out
          for f in nbcat mkemlog emlog_stat emlog_fuse; do
            cp "$f" "out/${f}-${{ matrix.name }}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: emlog-tools-${{ matrix.name }}
          path: out/
          if-no-files-found: error

  release:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: build-tools
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: emlog-tools-*
          path: artifacts

      - name: Package one tarball per architecture
        run: |
          set -eux
          mkdir -p release
          for d in artifacts/emlog-tools-*; do
            arch=$(basename "$d" | sed 's/^emlog-tools-//')
            chmod +x "$d"/*
            tar -C "$d" -czf "release/emlog-tools-${GITHUB_REF_NAME}-${arch}.tar.gz" .
          done
          ls -la release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Only the userspace tools (nbcat/mkemlog/emlog_stat/emlog_fuse)
          # are released as prebuilt binaries. emlog.ko is deliberately
          # NOT attached here: a kernel module's vermagic must match the
          # exact running kernel it's loaded into, so a prebuilt .ko from
          # this runner's generic kernel would almost certainly refuse to
          # insmod anywhere else -- see the DKMS section in README.md for
          # the actual recommended way to get emlog.ko onto a target
          # machine.
          files: release/*.tar.gz
          generate_release_notes: true
